<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Assets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />


    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">
</head>
<style>
    td{
        cursor: pointer;
        margin-top: 10px;
    }

    .life_style_imgaes{
        height: 600px;
    }
    @media screen and (max-width: 768px) {
        .life_style_imgaes{
            width: 100% !important;
            height: auto !important;
        }
    }

</style>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-12 py-3">
                <center><h2>Animation</h2></center>
            </div>
            <div class="col-lg-12 col-12 videoContent mt-3">
                <section class="splide splide_animation" aria-label="Splide Basic HTML Example">
                    <div class="splide__track">
                            <ul class="splide__list" style="text-align: center;">
                                <li class="splide__slide">
                                    <video id="player" width="100%" playsinline controls autoplay loop muted>
                                        <source src="https://cloverdesigngroup.com/maj3stic/assets/animation/Animation.mp4.webm" type="video/mp4" />
                                    </video>
                                </li>
                                <li class="splide__slide">
                                    <video id="player" width="55%" playsinline controls>
                                        <source src="https://cloverdesigngroup.com/ncr_samples/anim2.mp4.webm" type="video/mp4" />
                                    </video>                                </li>
                                <li class="splide__slide">
                                    <video id="player" width="100%" playsinline controls>
                                        <source src="https://cloverdesigngroup.com/superDNA/assets/animation/fridge.mp4.webm" type="video/mp4" />
                                    </video>
                                </li>
                            </ul>
                    </div>
                </section>
            </div>
        </div>
        <div class="row">
            <div class="col-12 py-3">
                <center><h2>Assets</h2></center>
            </div>
            <div class="col-lg-4 col-12 my-4">
                <div class="card text-center  p-3">
                    <div class="card-head"  style="text-transform: uppercase;">
                        ASSET 01
                    </div>
                    <div class="card-body">
                        <img height="200" width="200" loading="lazy" style="border-radius:10px;" src="https://cloverdesigngroup.com/walmart/3d-files/3793324971/images/3793324971.webp" alt="prevew" width="200">
                    </div>
                    <div class="card-foot">
                        <button class="btn btn-sm btn-primary preview_btn" data-bs-toggle="modal" data-bs-target="#myModal" data-name="ASSET 01" data-file="3793324971.glb">Preview for 3D</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-12 my-4">
                <div class="card text-center  p-3">
                    <div class="card-head"  style="text-transform: uppercase;">
                        ASSET 02
                    </div>
                    <div class="card-body">
                        <img height="200" width="200" loading="lazy" style="border-radius:10px;" src="https://cloverdesigngroup.com/walmart/3d-files/625221035/images/625221035.webp" alt="prevew" width="200">
                    </div>
                    <div class="card-foot">
                        <button class="btn btn-sm btn-primary preview_btn" data-bs-toggle="modal" data-bs-target="#myModal" data-name="ASSET 02" data-file="625221035.glb">Preview for 3D</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-12 my-4">
                <div class="card text-center  p-3">
                    <div class="card-head"  style="text-transform: uppercase;">
                        ASSET 03
                    </div>
                    <div class="card-body">
                        <img height="200" width="200" loading="lazy" style="border-radius:10px;" src="https://cloverdesigngroup.com/walmart/3d-files/308900393/images/308900393.webp" alt="prevew" width="200">
                    </div>
                    <div class="card-foot">
                        <button class="btn btn-sm btn-primary preview_btn" data-bs-toggle="modal" data-bs-target="#myModal" data-name="ASSET 03" data-file="308900393.glb">Preview for 3D</button>
                    </div>
                </div>
            </div>

        </div>
        <div class="row">
            <div class="col-lg-12">
                <center><h2 class="my-3">Scene Creation</h2></center>
               <video id="player" width="100%" playsinline controls>
                    <source src="https://cloverdesigngroup.com/video/Scene Creation without logo.webm" type="video/mp4" />
                </video>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <center><h2 class="my-3">3D Configurator</h2></center>
                <iframe src="https://unique-sopapillas-54ca88.netlify.app/" style="height:100vh;width: 100%;" frameborder="0"></iframe>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <center><h2 class="my-3">3D/AR Virtual Try-On</h2></center>
                <img src="https://cloverdesigngroup.com/testsssss/VR & AR Sample.jpg" alt="VR & AR Sample" width="100%">
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <center><h3 class="mb-4">3D Life Style Image</h3></center>
                <section class="splide splide_life_style" aria-label="Splide Basic HTML Example">
                    <div class="splide__track">
                            <ul class="splide__list" style="text-align: center;">
                                <li class="splide__slide">
                                <img src="https://cloverdesigngroup.com/sample_files/render/308900393.webp" class="life_style_imgaes" loading="lazy" alt="2d">
                                </li>
                                <li class="splide__slide">
                                <img src="https://cloverdesigngroup.com/sample_files/render/625221035.webp" class="life_style_imgaes" loading="lazy" alt="2d">
                                </li>
                                <li class="splide__slide">
                                <img src="https://cloverdesigngroup.com/sample_files/render/3793324971.webp" class="life_style_imgaes" loading="lazy" alt="2d">
                                </li>
                            </ul>
                    </div>
                </section>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <center><h2 class="my-3">Motion Graphics</h2></center>
                <video id="player" width="100%" height="100%" playsinline controls>
                    <source src="https://cloverdesigngroup.com/testsssss/Motion Graphics.mp4" type="video/mp4" />
                </video>
            </div>
        </div>
    </div>
   <!-- The Modal -->
    <div class="modal" id="myModal">
        <div class="modal-dialog modal-lg">
        <div class="modal-content">
    
            <!-- Modal Header -->
            <div class="modal-header">
            <h4 class="modal-title" style="text-transform: uppercase;"></h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
    
            <!-- Modal body -->
            <div class="modal-body bg-white text-dark">
                <div class="loader text-center">
                    <img  src="https://i.gifer.com/ZKZg.gif" alt="downloding" width="20">
                    <p>Downloading GLB file..</p>
                </div>
                <!-- Import the component -->

                <!-- Use it like any other HTML element -->
               
                <div class="glb_file text-center">

                </div>
            </div>
    
            <!-- Modal footer -->
            <!-- <div class="modal-footer">
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
            </div> -->
    
        </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        $(document).ready(function(){
            $('body').on('click', '.preview_btn', function(){
                $('.loader').removeClass('d-none');

                var glb_file_name = $(this).data('file');
                var glb_name = $(this).data('name');
                if(glb_name == 'Office Phone Booth')
                {
                    glb_name = 'Meeting Booth';
                }
                $('.modal-title').html(glb_name);
                $('.glb_file').html(`
                    <model-viewer
                        id="glb_file_view"
                        src="`+ glb_file_name +`"
                        camera-controls
                        style="text-align: center;width: 100%;height: 500px;">
                    </model-viewer>
                `);
                   // Add event listener to hide loader when the model is loaded
                document.getElementById('glb_file_view').addEventListener('load', function() {
                    $('.loader').addClass('d-none');
                });                
            });
            $('body').on('click', 'tr', function(){
                var this_content = $(this).data('content');

                console.log(this_content);

                $('.videoContent').html(`
                    <video id="player" width="100%" height="290" playsinline controls>
                        <source src="video/`+ this_content +`" type="video/mp4" />
                    </video>
                `);
                $('td').removeClass('text-primary');
                $(this).find('td').addClass('text-primary');
            });
        });
        // const player = videojs('vid1', {});
        var splide_life_style = new Splide( '.splide_life_style', {
        type  : 'fade',
        rewind: true,
        lazyload: "nearby",
        } );
        
        splide_life_style.mount();

        var splide_animation = new Splide( '.splide_animation', {
        type  : 'fade',
        rewind: true,
        lazyload: "nearby",
        } );
        
        splide_animation.mount();
    </script>
</body>
</html>
